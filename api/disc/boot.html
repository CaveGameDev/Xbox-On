<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b08">
  <link rel="icon" href="data:,">
  <title>Xbox One S</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:#080b08;color:#e8f2e6}
    body{display:grid;place-items:center;overflow:hidden;
      background:radial-gradient(ellipse at 50% 62%,#107c10 0%,#0a2f0b 52%,#050805 100%)}
    main{width:min(30rem,84vw);text-align:center}
    h1{margin:0 0 .35rem;font-size:13px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;opacity:.55}
    #label{margin:0 0 1.15rem;font-size:19px;font-weight:600}
    .bar{position:relative;height:6px;border-radius:999px;background:rgba(255,255,255,.13);overflow:hidden}
    .bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;background:#9bf00b;
      box-shadow:0 0 14px #9bf00b88;transition:width .18s linear}
    #meta{margin:.7rem 0 0;font-size:12px;font-variant-numeric:tabular-nums;opacity:.6;min-height:1.2em}
    #meta[data-error]{color:#ff9a9a;opacity:1;white-space:pre-wrap}
  </style>
</head>
<body>
  <main>
    <h1>Xbox One S</h1>
    <p id="label">Reading the disc…</p>
    <div class="bar" role="progressbar" aria-labelledby="label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="fill"></i></div>
    <p id="meta"></p>
  </main>
  <script>
    /* Isolated entry point. This document is served with the COOP/COEP headers the
       game needs, so the page unpacked out of site.bin can take the document over
       and keep crossOriginIsolated true. Nothing here waits for a click.

       Only game.html is wanted out of the archive, so the shell range-reads the
       archive header and that one entry instead of pulling the whole ~17 MB bin
       (the glb and the disc texture in there belong to the console page). Hosts
       that ignore Range still get the full download with a real progress bar. */
    (async function boot() {
      const SITE = '/api/disc/site.bin';
      const fill = document.getElementById('fill');
      const bar = fill.parentElement;
      const label = document.getElementById('label');
      const meta = document.getElementById('meta');

      let whole = null;           // set if the host makes us take the full archive

      const paint = (fraction, text) => {
        const percent = Math.max(0, Math.min(100, Math.round(fraction * 100)));
        fill.style.width = percent + '%';
        bar.setAttribute('aria-valuenow', String(percent));
        if (text !== undefined) meta.textContent = text;
      };
      const fail = (message) => {
        label.textContent = 'The disc could not be read';
        meta.dataset.error = '';
        meta.textContent = message + '\nReload the page to try again.';
      };

      if (!crossOriginIsolated) {
        fail('This page was served without the Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy headers, so the game cannot start.');
        return;
      }

      // streams a response body into one buffer, driving the bar as it goes
      async function drain(response) {
        const total = Number(response.headers.get('content-length')) || 0;
        if (!(response.body && response.body.getReader)) return new Uint8Array(await response.arrayBuffer());
        const reader = response.body.getReader();
        const chunks = [];
        let received = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;
          if (total) paint(received / total, (received / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB');
        }
        const bytes = new Uint8Array(received);
        let at = 0;
        for (const chunk of chunks) { bytes.set(chunk, at); at += chunk.length; }
        return bytes;
      }

      async function downloadWhole() {
        const response = await fetch(SITE, { cache: 'no-store' });
        if (!response.ok) throw new Error('site.bin ' + response.status);
        whole = await drain(response);
        return whole;
      }

      // inclusive byte range; falls back to the full archive when Range is ignored
      async function slice(start, end) {
        if (whole) return whole.subarray(start, end + 1);
        const response = await fetch(SITE, {
          cache: 'no-store',
          headers: { Range: 'bytes=' + start + '-' + end }
        });
        if (response.status === 206) return new Uint8Array(await response.arrayBuffer());
        const all = await downloadWhole();
        return all.subarray(start, end + 1);
      }

      try {
        const prefix = await slice(0, 11);
        if (prefix.length !== 12) throw new Error('site.bin is too short to be an archive');
        if (new TextDecoder().decode(prefix.subarray(0, 8)) !== 'SITEBIN1') throw new Error('site.bin is not a SITEBIN1 archive');
        paint(0.35, 'Archive header');

        const headerLength = new DataView(prefix.buffer, prefix.byteOffset, 12).getUint32(8, true);
        if (!headerLength || headerLength > 1 << 20) throw new Error('site.bin header length looks wrong');
        const header = JSON.parse(new TextDecoder().decode(await slice(12, 12 + headerLength - 1)));
        const base = 12 + headerLength;

        const file = header.files.find((entry) => entry.name === 'game.html');
        if (!file) throw new Error('game.html is missing from site.bin');

        label.textContent = 'Unpacking the disc…';
        paint(0.7, 'Reading game.html');
        const html = new TextDecoder().decode(await slice(base + file.offset, base + file.offset + file.size - 1));

        paint(1, 'Starting…');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error('[site.bin]', error);
        fail(error.message || String(error));
      }
    })();
  </script>
</body>
</html>
